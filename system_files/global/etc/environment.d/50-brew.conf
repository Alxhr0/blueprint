# Add Homebrew bin/sbin to PATH for all systemd user sessions.
#
# This is the authoritative PATH source for GNOME desktop sessions: systemd
# processes it early during `systemd --user` startup and every process
# spawned from the session (terminal emulators, GUI apps, background
# services, non-login shells) inherits it.
#
# Without it, brew-installed CLI tools (e.g. `fastfetch`) are only on
# PATH when an *interactive login* shell sources /etc/profile.d/brew.sh,
# leaving GUI apps and non-login shells unable to find them.
#
# A non-existent directory on PATH is harmless, so this works even on
# first boot before brew-setup.service has unpacked Homebrew.
PATH=${PATH}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
