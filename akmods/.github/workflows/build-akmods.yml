---
name: Build Akmods (OGC Arch Kernel)

# Builds the cached kernel-modules image for the pinned OpenGamingCollective
# Arch kernel (linux-ogc): nvidia-open + zfs .ko, keyed to the exact kernel
# version. Downstream bootc images COPY from this cache so nvidia/zfs always
# match linux-ogc (kernel pinning is required because zfs is compiled against
# the kernel's exact headers).
#
# Kernel is pinned in akmods/images.yaml; change the `tag` there to re-pin.
on:
  push:
    branches:
      - main
    paths:
      - "akmods/**"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build akmods cache
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          storage-backend: remove-software
          update-podman: true
          install-tools: '["just", "cosign", "skopeo", "oras"]'

      - name: Resolve pinned kernel version
        id: kernel
        run: |
          set -euo pipefail
          # Kernel pin lives only in akmods/images.yaml; resolve-kernel.sh and
          # the Justfile read the same file, so build + tags always agree.
          KERNEL="$(bash akmods/scripts/resolve-kernel.sh)"
          echo "${KERNEL}"
          echo "kernel=${KERNEL}" >> "${GITHUB_OUTPUT}"

      - name: Build akmods cache image
        shell: bash
        run: |
          set -euo pipefail
          sudo -E env "PATH=${PATH}" "$(command -v just)" -f akmods/Justfile build

      - name: Determine build tags
        id: tags
        env:
          KERNEL: ${{ steps.kernel.outputs.kernel }}
        run: |
          DATE=$(date +%Y%m%d)
          TAGS="ogc-x86_64 ogc-${KERNEL} ogc-${DATE}-x86_64"
          echo "${TAGS}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "default_tag=ogc-x86_64" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        id: push-image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            sudo -E podman push "localhost/akmods:ogc-x86_64" "${IMAGE_REGISTRY}/akmods:${tag}"
          done
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_REGISTRY}/akmods:ogc-x86_64")"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
            cosign sign -y \
              --new-bundle-format=false \
              --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY \
              "${IMAGE_REGISTRY}/akmods@${DIGEST}"
          fi
