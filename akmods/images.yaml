# akmods build matrix.
#
# Single kernel flavor today: `ogc` (the OpenGamingCollective Arch kernel,
# linux-ogc). Modules built against the pinned kernel and cached in a scratch
# image for downstream bootc images to COPY from, so nvidia+zfs always match
# the exact linux-ogc release (kernel pinning is required because zfs is
# compiled against the kernel's exact headers).
#
# To bump the kernel: bump `tag` to a concrete OGC release (e.g. 7.2.1-ogc2)
# and let the build re-pin. `latest` tracks the live upstream stream and is
# NOT a stable pin — commit a concrete version once you care about matching
# downstream images.
defaults:
  kernel: ogc
  registry: ghcr.io
  organization: huntedraven7

ogc:
  # OGC Arch kernel OCI artifact that ships linux-ogc / linux-ogc-headers
  # *.pkg.tar.zst. Resolved with `oras pull` in the prep stage.
  image: ghcr.io/opengamingcollective/kernel-packages-arch
  tag: latest

# Modules built against the pinned kernel. `targets` mirrors which module
# groups the cache image contains.
targets:
  - nvidia
  - zfs

# Optional: pin zfs to a release series (e.g. "2.4") so OpenZFS stays within
# its supported-kernel window. Empty = latest stable release.
zfs:
  minor_version: ""
