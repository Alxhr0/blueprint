[gnome]
packages = [
    "adwaita-fonts-all",
    "dbus-daemon",
    "gdm",
    "gnome-bluetooth",
    "gnome-color-manager",
    "gnome-control-center",
    "gnome-initial-setup",
    "gnome-remote-desktop",
    "gnome-session-wayland-session",
    "gnome-settings-daemon",
    "gnome-shell",
    "gnome-user-docs",
    "gvfs-fuse",
    "gvfs-goa",
    "gvfs-mtp",
    "gvfs-smb",
    "libsane-hpaio",
    "nautilus",
    "orca",
    "ptyxis",
    "sane-backends-drivers-scanners",
    "xdg-desktop-portal-gnome",
    "xdg-user-dirs-gtk",
    "yelp",
    "NetworkManager-wifi",
    "polkit",
    "pipewire",
    "wireplumber",
    "pulseaudio-utils",
    "xdg-desktop-portal",
    "xdg-desktop-portal-gtk",
    "gnome-keyring",
    "seahorse",
    "nautilus-extensions",
]

[gnome_excluded]
packages = [
    "PackageKit",
    "PackageKit-command-not-found",
    "gnome-software",
    "gnome-extensions-app",
]

[install]
packages = [
    "NetworkManager-openconnect-gnome",
    "NetworkManager-openvpn-gnome",
    "btrfs-progs",
    "containerd",
    "ddcutil",
    "distrobox",
    "fastfetch",
    "firewalld",
    "flatpak",
    "firefox",
    "gnome-disk-utility",
    "hplip",
    "ibus-chewing",
    "jxl-pixbuf-loader",
    "nss-mdns",
    "ntfs-3g",
    "pcsc-lite",
    "system-reinstall-bootc",
    "tuned-ppd",
    "wireguard-tools",
    "wl-clipboard",
    "xdg-terminal-exec",
    "xhost",
    "docker",
    "docker-compose",
    "podman",
    "buildah",
    "skopeo",
    "curl",
    "wget",
    "git",
    "jq",
    "python3",
    "python-pip",
    "nodejs",
    "npm",
    "gcc",
    "make",
    "rust",
    "zstd",
    "unzip",
    "fzf",
    "ffmpeg",
    "fwupd",
    "cups",
    "openssh",
    "chrony",
    "iwd",
    "sudo",
]

[install_excluded]
packages = [
    "gnome-extensions-app",
]

[remove]
packages = [
    "setroubleshoot",
]

[versionlock_gnome]
packages = [
    "gnome-shell",
    "gdm",
    "mutter",
    "gnome-session-wayland-session",
    "gnome-settings-daemon",
    "gnome-control-center",
    "gsettings-desktop-schemas",
    "gtk4",
    "libadwaita",
    "pango",
    "fontconfig",
    "selinux-policy",
    "selinux-policy-targeted",
    "gnutls",
]
