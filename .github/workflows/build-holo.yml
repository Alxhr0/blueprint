name: Build Holo Images

on:
  schedule:
    - cron: '0 4 * * *' # 4:00am UTC daily
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-holo:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [holo-amd, holo-nvidia]

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: remove-software
          update-podman: true
          install-tools: '["just", "cosign"]'

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y skopeo

      - name: Prepare environment
        env:
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          echo "TARGET_IMAGE=${TARGET_IMAGE}" >> "$GITHUB_ENV"

          source <(just variant-env "${TARGET_IMAGE}")

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "$GITHUB_ENV"

          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Pull Arch Base Image
        id: pull-arch
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE_REGISTRY,,}"
          sudo -E podman pull "${REGISTRY}/blueprint:arch" || true
          IMAGE_ID=$(sudo -E podman images --filter reference="${REGISTRY}/blueprint:arch" --format '{{.ID}}' | head -n1)
          if [[ -z "${IMAGE_ID}" ]]; then
            echo "Arch base image not found in registry, building locally..."
            sudo -E "$(command -v just)" build arch
          else
            sudo -E podman tag "${IMAGE_ID}" "blueprint:arch"
          fi

      - name: Build Holo Image
        id: build-image
        run: |
          sudo -E "$(command -v just)" build \
            "${TARGET_IMAGE}"

      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          sudo -E "$(command -v just)" rechunk \
            "blueprint" \
            "${DEFAULT_TAG}"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          if [[ -z "$(git status -s)" ]]; then
              GIT_SHA=$(git rev-parse --short HEAD)
              BUILD_TAGS+=("${DEFAULT_TAG}-${GIT_SHA}")
              BUILD_TAGS+=("${DEFAULT_TAG}-${DATE}-${GIT_SHA}")
          fi
          BUILD_TAGS+=("${DEFAULT_TAG}-${DATE}")
          BUILD_TAGS+=("${DEFAULT_TAG}")
          echo "${BUILD_TAGS[*]}"
          echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E "$(command -v just)" tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push To GHCR
        if: github.event_name != 'pull_request'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        uses: projectbluefin/actions/bootc-build/push-image@v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.gen-build-tags.outputs.alias_tags }}
          default-tag: ${{ env.DEFAULT_TAG }}
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
