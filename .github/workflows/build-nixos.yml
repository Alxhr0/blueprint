name: Build NixOS Image

on:
  schedule:
    - cron: '0 8 */2 * *' # 8:00am UTC every 2 days
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-nixos:
    name: Build and push nixos-bootc:testing
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: remove-software
          update-podman: true
          install-tools: '["just", "cosign"]'

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y skopeo

      - name: Build NixOS Image
        id: build-image
        run: |
          sudo -E "$(command -v just)" build nixos

      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          sudo -E "$(command -v just)" rechunk \
            "nixos-bootc" \
            "testing"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          if [[ -z "$(git status -s)" ]]; then
              GIT_SHA=$(git rev-parse --short HEAD)
              BUILD_TAGS+=("testing-${GIT_SHA}")
              BUILD_TAGS+=("testing-${DATE}-${GIT_SHA}")
          fi
          BUILD_TAGS+=("testing-${DATE}")
          BUILD_TAGS+=("testing")
          echo "${BUILD_TAGS[*]}"
          echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail

          IMAGE_ID=$(sudo -E podman images --filter reference="nixos-bootc:testing" --format '{{.ID}}' | head -n1)
          sudo -E podman tag "${IMAGE_ID}" "nixos-bootc:testing"

          for tag in ${ALIAS_TAGS}; do
            if [[ "${tag}" != "testing" ]]; then
              sudo -E podman tag "${IMAGE_ID}" "nixos-bootc:${tag}"
            fi
          done

          sudo -E podman images

      - name: Push To GHCR
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        uses: projectbluefin/actions/bootc-build/push-image@v1
        with:
          image-name: nixos-bootc
          tags: ${{ steps.gen-build-tags.outputs.alias_tags }}
          default-tag: testing
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nixos-bootc@${DIGEST}"
