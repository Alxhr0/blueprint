name: Build All Images

on:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-all:
    name: Build all images
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        # Every base image plus the external homepage convenience build.
        image: [homepage, arch, debian, opensuse, nixos, ubuntu, fsdk]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: remove-software
          update-podman: false
          install-tools: '["just", "cosign"]'

      - name: Prepare environment
        env:
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          echo "TARGET_IMAGE=${TARGET_IMAGE}" >> "$GITHUB_ENV"

          case "${TARGET_IMAGE}" in
            homepage)
              echo "IMAGE_NAME=homepage" >> "$GITHUB_ENV"
              echo "DEFAULT_TAG=latest" >> "$GITHUB_ENV"
              ;;
            fsdk)
              echo "IMAGE_NAME=blueprint" >> "$GITHUB_ENV"
              echo "DEFAULT_TAG=fsdk" >> "$GITHUB_ENV"
              ;;
            *)
              # Resolve this variant's image name and tag from its inline identity.
              source <(just variant-env "${TARGET_IMAGE}")
              echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
              echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "$GITHUB_ENV"
              ;;
          esac

          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Build Image
        id: build-image
        run: |
          set -euo pipefail
          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            SOURCE_REPO="https://codeberg.org/thelinuxcast/Homepage.git"
            git clone "${SOURCE_REPO}" /tmp/homepage
            cd /tmp/homepage
            sudo -E podman build -t "homepage:latest" .
          elif [[ "${{ matrix.image }}" == "fsdk" ]]; then
            # sudo's secure_path strips PATH (even with -E), hiding just from
            # the recipe's nested `just build`; restore it explicitly. -E keeps
            # GITHUB_ACTIONS so buildstream's bst recipe runs local, not the cluster.
            sudo -E env "PATH=${PATH}" "$(command -v just)" build-fsdk
          else
            sudo -E "$(command -v just)" build "${{ matrix.image }}"
          fi

      - name: Rechunk with Chunkah
        if: ${{ matrix.image != 'homepage' && matrix.image != 'fsdk' }}
        id: rechunk
        run: |
          sudo -E "$(command -v just)" rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euo pipefail
          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            DATE=$(date +%Y%m%d)
            BUILD_TAGS=()
            SOURCE_SHA=$(cd /tmp/homepage && git rev-parse --short HEAD)
            BUILD_TAGS+=("${SOURCE_SHA}")
            BUILD_TAGS+=("${DATE}-${SOURCE_SHA}")
            BUILD_TAGS+=("${DATE}")
            BUILD_TAGS+=("latest")
            echo "${BUILD_TAGS[*]}"
            echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date +%Y%m%d)
            BUILD_TAGS=()
            if [[ -z "$(git status -s)" ]]; then
                GIT_SHA=$(git rev-parse --short HEAD)
                BUILD_TAGS+=("${DEFAULT_TAG}-${GIT_SHA}")
                BUILD_TAGS+=("${DEFAULT_TAG}-${DATE}-${GIT_SHA}")
            fi
            BUILD_TAGS+=("${DEFAULT_TAG}-${DATE}")
            BUILD_TAGS+=("${DEFAULT_TAG}")
            echo "${BUILD_TAGS[*]}"
            echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            IMAGE_ID=$(sudo -E podman images --filter reference="homepage:latest" --format '{{.ID}}' | head -n1)
            sudo -E podman tag "${IMAGE_ID}" "homepage:latest"
            for tag in ${ALIAS_TAGS}; do
              if [[ "${tag}" != "latest" ]]; then
                sudo -E podman tag "${IMAGE_ID}" "homepage:${tag}"
              fi
            done
          else
            IMAGE_ID=$(sudo -E podman images --filter reference="${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.ID}}' | head -n1)
            sudo -E podman tag "${IMAGE_ID}" "${IMAGE_NAME}:${DEFAULT_TAG}"
            for tag in ${ALIAS_TAGS}; do
              if [[ "${tag}" != "${DEFAULT_TAG}" ]]; then
                sudo -E podman tag "${IMAGE_ID}" "${IMAGE_NAME}:${tag}"
              fi
            done
          fi
          sudo -E podman images

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          REGISTRY="${IMAGE_REGISTRY,,}"

          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            for tag in ${ALIAS_TAGS}; do
              sudo -E podman push \
                --digestfile=/tmp/digestfile \
                "homepage:${tag}" \
                "${REGISTRY}/homepage:${tag}"
            done
          else
            for tag in ${ALIAS_TAGS}; do
              sudo -E podman push \
                --digestfile=/tmp/digestfile \
                "${IMAGE_NAME}:${tag}" \
                "${REGISTRY}/${IMAGE_NAME}:${tag}"
            done
          fi

          digest="$(< /tmp/digestfile)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE_REGISTRY,,}"
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
