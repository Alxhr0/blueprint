name: Build All Images

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Build all images
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        image: [arch, edward, ai, debian, server, aira, homepage, gentoo, opensuse, ubuntu]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: remove-software
          update-podman: false
          install-tools: '["just"]'

      - name: Build Image
        id: build-image
        run: |
          set -euo pipefail
          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            SOURCE_REPO="https://codeberg.org/thelinuxcast/Homepage.git"
            git clone "${SOURCE_REPO}" /tmp/homepage
            cd /tmp/homepage
            sudo -E podman build -t "homepage:latest" .
          else
            sudo -E "$(command -v just)" build "${{ matrix.image }}"
          fi

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euo pipefail
          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            DATE=$(date +%Y%m%d)
            BUILD_TAGS=()
            SOURCE_SHA=$(cd /tmp/homepage && git rev-parse --short HEAD)
            BUILD_TAGS+=("${SOURCE_SHA}")
            BUILD_TAGS+=("${DATE}-${SOURCE_SHA}")
            BUILD_TAGS+=("${DATE}")
            BUILD_TAGS+=("latest")
            echo "${BUILD_TAGS[*]}"
            echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date +%Y%m%d)
            BUILD_TAGS=()
            if [[ -z "$(git status -s)" ]]; then
                GIT_SHA=$(git rev-parse --short HEAD)
                BUILD_TAGS+=("${{ matrix.image }}-${GIT_SHA}")
                BUILD_TAGS+=("${{ matrix.image }}-${DATE}-${GIT_SHA}")
            fi
            BUILD_TAGS+=("${{ matrix.image }}-${DATE}")
            BUILD_TAGS+=("${{ matrix.image }}")
            echo "${BUILD_TAGS[*]}"
            echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            IMAGE_ID=$(sudo -E podman images --filter reference="homepage:latest" --format '{{.ID}}')
            sudo -E podman tag "${IMAGE_ID}" "homepage:latest"
            for tag in ${ALIAS_TAGS}; do
              if [[ "${tag}" != "latest" ]]; then
                sudo -E podman tag "${IMAGE_ID}" "homepage:${tag}"
              fi
            done
          else
            IMAGE_ID=$(sudo -E podman images --filter reference="blueprint:${{ matrix.image }}" --format '{{.ID}}')
            sudo -E podman tag "${IMAGE_ID}" "blueprint:${{ matrix.image }}"
            for tag in ${ALIAS_TAGS}; do
              if [[ "${tag}" != "${{ matrix.image }}" ]]; then
                sudo -E podman tag "${IMAGE_ID}" "blueprint:${tag}"
              fi
            done
          fi
          sudo -E podman images

      - name: Push To GHCR
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          REGISTRY="${IMAGE_REGISTRY,,}"

          if [[ "${{ matrix.image }}" == "homepage" ]]; then
            for tag in ${ALIAS_TAGS}; do
              sudo -E podman push \
                --digestfile=/tmp/digestfile \
                "homepage:${tag}" \
                "${REGISTRY}/homepage:${tag}"
            done
          else
            for tag in ${ALIAS_TAGS}; do
              sudo -E podman push \
                --digestfile=/tmp/digestfile \
                "blueprint:${tag}" \
                "${REGISTRY}/blueprint:${tag}"
            done
          fi

          digest="$(< /tmp/digestfile)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
