name: Build Arch Base Image

on:
  schedule:
    - cron: '0 1 */2 * *' # 1:00am UTC every 2 days
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build-arch:
    name: Build and push arch base
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: remove-software
          update-podman: true
          install-tools: '["just", "cosign"]'

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y skopeo

      - name: Build Arch Base Image
        id: build-image
        run: |
          set -euo pipefail
          sudo -E "$(command -v just)" build arch

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          if [[ -z "$(git status -s)" ]]; then
              GIT_SHA=$(git rev-parse --short HEAD)
              BUILD_TAGS+=("arch-${GIT_SHA}")
              BUILD_TAGS+=("arch-${DATE}-${GIT_SHA}")
          fi
          BUILD_TAGS+=("arch-${DATE}")
          BUILD_TAGS+=("arch")
          echo "${BUILD_TAGS[*]}"
          echo "alias_tags=${BUILD_TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail

          IMAGE_ID=$(sudo -E podman images --filter reference="blueprint:arch" --format '{{.ID}}')
          sudo -E podman tag "${IMAGE_ID}" "blueprint:arch"

          for tag in ${ALIAS_TAGS}; do
            if [[ "${tag}" != "arch" ]]; then
              sudo -E podman tag "${IMAGE_ID}" "blueprint:${tag}"
            fi
          done

          sudo -E podman images

      - name: Push To GHCR
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        uses: projectbluefin/actions/bootc-build/push-image@v1
        with:
          image-name: blueprint
          tags: ${{ steps.gen-build-tags.outputs.alias_tags }}
          default-tag: arch
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "ghcr.io/${{ github.repository_owner }}/blueprint@${DIGEST}"
