# Edward — Hyprland starter configuration
# Docs: https://wiki.hyprland.org/Configuring/

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

monitor = ,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(585b7080)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

misc {
    force_default_wallpaper = 0
}

# Session wiring for portals and systemd user services
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Create ~/Documents, ~/Downloads, etc. on first session (Hyprland doesn't
# run desktop-environment startup hooks)
exec-once = xdg-user-dirs-update
# Desktop shell (quickshell is a toolkit — point QS_CONFIG_PATH at your shell
# config, e.g. caelestia/end-4, or drop it in ~/.config/quickshell/)
exec-once = quickshell
# Authentication agent (system dialogs for sudo-like prompts in the session)
exec-once = systemctl --user start hyprpolkitagent.service

# Keybinds
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, D, exec, fuzzel
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating,
bind = $mod SHIFT, E, exit
bindl = , Print, exec, sh -c 'mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%s).png'

# Focus with arrow keys / hjkl
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move windows across workspaces
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Switch workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Mouse drag to move/resize floating windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
